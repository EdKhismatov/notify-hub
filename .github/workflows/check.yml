on:
  pull_request:
    branches:
      - '*'

name: Project check
jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/checkout@v4
        name: Checkout

      - name: Install dependencies
        run: npm ci

      - name: Build projects
        run: |
          npx nest build producer
          npx nest build consumer
          npx nest build telegram-notifier

      - name: Lint code
        run: npm run lint